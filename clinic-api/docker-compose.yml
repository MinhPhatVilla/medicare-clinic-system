
# ============================================================
# Docker Compose — MediCare Clinic System
# ============================================================

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: medicare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medicare_user
      POSTGRES_PASSWORD: medicare_pass_2024
      POSTGRES_DB: medicare_db
    ports:
      - "5432:5432"       # Expose để pgAdmin/DBeaver kết nối từ host
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare_user -d medicare_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- pgAdmin (Giao diện quản lý DB trực quan) ----
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medicare_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medicare.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"          # Truy cập: http://localhost:5050
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

# ============================================================
# Hướng dẫn sử dụng:
#
# 1. Khởi động database:
#    docker-compose up -d
#
# 2. Kiểm tra logs:
#    docker-compose logs -f postgres
#
# 3. Truy cập pgAdmin: http://localhost:5050
#    Email: admin@medicare.local
#    Password: admin123
#    Sau đó thêm server: Host=postgres, User=medicare_user, Pass=medicare_pass_2024
#
# 4. Dừng:
#    docker-compose down
#
# 5. Xóa toàn bộ data (cẩn thận):
#    docker-compose down -v
# ============================================================
