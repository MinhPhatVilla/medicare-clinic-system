# ============================================================
# MediCare Clinic System - Root Docker Compose
# Khởi chạy toàn bộ hạ tầng cơ sở dữ liệu từ thư mục infrastructure
# Cách dùng: docker compose up -d
# ============================================================

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: medicare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-medicare_user}
      POSTGRES_PASSWORD: ${DB_PASS:-medicare_pass_2024}
      POSTGRES_DB: ${DB_NAME:-medicare_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medicare_user} -d ${DB_NAME:-medicare_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medicare_network

  # ---- pgAdmin 4 (Quản trị Database trực quan) ----
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medicare_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@medicare.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medicare_network

volumes:
  postgres_data:
    name: medicare_postgres_data
    driver: local

networks:
  medicare_network:
    name: medicare_network
    driver: bridge
